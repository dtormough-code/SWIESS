<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke</title>
</head>
<body>
    <h1>Random Joke Generator</h1>
    <p id="joke">Click the button to get a random joke!</p>
    <button id="jokeButton">Get Joke</button>
    <script>
async function fetchJoke() {
       document.getElementById('joke').innerText = "Loading...";  // ADD THIS
  try {
    const response = await fetch('https://official-joke-api.appspot.com/random_joke');
    const jokeData = await response.json();
    document.getElementById('joke').innerText = `${jokeData.setup} - ${jokeData.punchline}`;
  } catch (error) {
    document.getElementById('joke').innerText = 'Failed to fetch a joke. Please try again.';
  }
}

document.getElementById("jokeButton").addEventListener("click", fetchJoke);
        
    </script>
</body>
</html>
